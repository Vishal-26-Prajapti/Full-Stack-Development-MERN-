<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Library Management System</title>
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="./Vishal_logo.png" type="image/x-icon">
    </head>

    <body>

        <div class="container">
            <h1>📚 Library Management System</h1>

            <div class="card">
                <h2>Add Book</h2>
                <div class="input-group">
                    <input type="text" id="title" placeholder="Book Title">
                    <input type="text" id="author" placeholder="Author">
                    <input type="text" id="bookId" placeholder="Book ID">
                </div>
                <button onclick="addBook()">Add Book</button>
            </div>

            <div class="card">
                <h2>Issue Book</h2>
                <input type="text" id="issueId" placeholder="Book ID">
                <input type="date" id="dueDate">
                <button onclick="issueBook()">Issue</button>
            </div>

            <div class="card">
                <h2>Return Book</h2>
                <input type="text" id="returnId" placeholder="Book ID">
                <button onclick="returnBook()">Return</button>
            </div>

            <div class="card">
                <h2>Library Books</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Status</th>
                            <th>Due Date</th>
                        </tr>
                    </thead>
                    <tbody id="bookList"></tbody>
                </table>
            </div>

        </div>

        <script src="script.js"></script>
    </body>

</html>
