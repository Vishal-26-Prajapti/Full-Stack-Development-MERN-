<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Live Character Count</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="./Vishal_logo.png" type="image/x-icon">
    </head>

    <body>

        <div class="container">
            <div class="header">
                <h2>Character Counter</h2>
                <span class="limit-badge">Max <strong>300</strong></span>
            </div>

            <div class="textarea-wrapper">
                <textarea id="textarea" placeholder="Start typing your text here..." maxlength="300"></textarea>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <span class="stat-value" id="charCount">0</span>
                    <span class="stat-label">Characters</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="noSpaceCount">0</span>
                    <span class="stat-label">No Spaces</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="wordCount">0</span>
                    <span class="stat-label">Words</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="remaining">300</span>
                    <span class="stat-label">Remaining</span>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" id="clearBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6l-1 14H6L5 6" />
                        <path d="M10 11v6M14 11v6" />
                        <path d="M9 6V4h6v2" />
                    </svg>
                    Clear
                </button>
                <button class="btn btn-primary" id="copyBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" />
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                    </svg>
                    Copy Text
                </button>
            </div>

            <div class="toast" id="toast">✓ Copied to clipboard!</div>
        </div>

        <script src="script.js"></script>
    </body>

</html>
