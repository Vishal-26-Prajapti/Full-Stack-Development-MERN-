<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mood Vibe</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="./style.css">
        <link rel="shortcut icon" href="./Vishal_logo.png" type="image/x-icon">

    </head>

    <body>

        <div class="ambient">
            <div class="blob blob1" id="blob1"></div>
            <div class="blob blob2" id="blob2"></div>
            <div class="blob blob3" id="blob3"></div>
        </div>

        <section class="hero">
            <h1>How are you <span>feeling</span><br>right now?</h1>
            <p>Pick your mood. Get a curated sonic world — genre, artists, tempo, and a playlist built for the feeling.
            </p>
        </section>

        <section class="mood-section">
            <div class="mood-grid" id="moodGrid"></div>
        </section>

        <div class="vibe-panel" id="vibePanel">
            <div class="vibe-inner" id="vibeInner"></div>
        </div>

        <script src="./script.js"></script>
    </body>

</html>
