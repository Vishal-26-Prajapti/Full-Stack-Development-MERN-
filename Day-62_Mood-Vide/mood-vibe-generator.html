<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0f14;
    --surface: #14171f;
    --surface2: #1c202b;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --muted: #5a6278;
    --muted2: #8892a4;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Ambient background blobs */
  .ambient {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0;
    transition: opacity 1.2s ease, background 1.2s ease, transform 1.2s ease;
  }
  .blob1 { width: 600px; height: 600px; top: -200px; left: -200px; }
  .blob2 { width: 500px; height: 500px; bottom: -150px; right: -150px; }
  .blob3 { width: 300px; height: 300px; top: 40%; left: 50%; transform: translate(-50%,-50%); }

  /* Header */
  header {
    position: relative; z-index: 10;
    padding: 48px 48px 0;
    animation: fadeDown 0.6s ease both;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted2);
  }

  /* Hero */
  .hero {
    position: relative; z-index: 10;
    padding: 56px 48px 48px;
    animation: fadeDown 0.6s 0.1s ease both;
  }
  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: var(--text);
    margin-bottom: 16px;
  }
  .hero h1 span { color: var(--muted); }
  .hero p {
    font-size: 1rem;
    color: var(--muted2);
    max-width: 420px;
    line-height: 1.7;
    font-weight: 300;
  }

  /* Mood grid */
  .mood-section {
    position: relative; z-index: 10;
    padding: 0 48px 48px;
    animation: fadeDown 0.6s 0.2s ease both;
  }
  .mood-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .mood-btn {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 16px 18px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.3s, background 0.3s, transform 0.15s;
    overflow: hidden;
  }
  .mood-btn::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 16px;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .mood-btn:hover { transform: translateY(-3px); border-color: var(--border2); }
  .mood-btn:hover::before { opacity: 1; }
  .mood-btn.active {
    border-color: transparent;
    transform: translateY(-3px);
  }
  .mood-btn.active::before { opacity: 1; }

  .mood-icon-wrap {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    font-size: 18px;
    transition: transform 0.3s;
  }
  .mood-btn:hover .mood-icon-wrap { transform: scale(1.1); }
  .mood-btn.active .mood-icon-wrap { transform: scale(1.1); }

  .mood-label {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    display: block;
    margin-bottom: 4px;
  }
  .mood-sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
    font-family: 'DM Mono', monospace;
  }

  /* Vibe panel */
  .vibe-panel {
    position: relative; z-index: 10;
    margin: 0 48px 48px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 24px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.6s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease, margin 0.4s;
  }
  .vibe-panel.open {
    max-height: 1000px;
    opacity: 1;
    margin-bottom: 48px;
  }

  .vibe-inner { padding: 36px; }

  /* Vibe header */
  .vibe-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
    gap: 20px;
  }
  .vibe-title-block {}
  .vibe-genre-badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 30px;
    border: 1px solid var(--border2);
    color: var(--muted2);
    margin-bottom: 14px;
  }
  .vibe-name {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 8px;
  }
  .vibe-tagline {
    font-size: 0.95rem;
    color: var(--muted2);
    font-weight: 300;
  }
  .vibe-palette {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .palette-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.2);
    transition: transform 0.2s;
  }
  .palette-dot:hover { transform: scale(1.2); }

  /* Stats row */
  .vibe-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-block {
    background: var(--surface2);
    border-radius: 14px;
    padding: 18px 20px;
    border: 1px solid var(--border);
  }
  .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: block;
  }
  .stat-val {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }

  /* Two-col layout */
  .vibe-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .section-heading {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* Artists */
  .artist-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .artist-chip {
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 30px;
    border: 1px solid var(--border2);
    color: var(--muted2);
    background: var(--surface2);
    font-weight: 400;
    transition: color 0.2s, border-color 0.2s;
    cursor: default;
  }
  .artist-chip:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }

  /* Tracks */
  .track-list { display: flex; flex-direction: column; gap: 6px; }
  .track-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: border-color 0.2s, transform 0.15s;
    cursor: default;
  }
  .track-row:hover { border-color: var(--border2); transform: translateX(4px); }
  .track-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 18px;
  }
  .track-info { flex: 1; }
  .track-name { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .track-artist { font-size: 11px; color: var(--muted2); }
  .track-dur {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* Footer */
  footer {
    position: relative; z-index: 10;
    padding: 0 48px 48px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    animation: fadeDown 0.6s 0.3s ease both;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 900px) {
    header, .hero, .mood-section, .vibe-panel, footer { padding-left: 24px; padding-right: 24px; }
    .vibe-panel { margin-left: 24px; margin-right: 24px; }
    .mood-grid { grid-template-columns: repeat(2, 1fr); }
    .vibe-body { grid-template-columns: 1fr; }
    .hero h1 { font-size: 2.2rem; }
  }
  @media (max-width: 500px) {
    .mood-grid { grid-template-columns: repeat(2, 1fr); }
    .vibe-stats { grid-template-columns: 1fr; }
    .vibe-name { font-size: 1.6rem; }
    header, .hero, .mood-section, .vibe-panel, footer { padding-left: 16px; padding-right: 16px; }
    .vibe-panel { margin-left: 16px; margin-right: 16px; }
  }
</style>
</head>

let current = null;

function setBlobs(m) {
  document.getElementById('blob1').style.background = m.blob1;
  document.getElementById('blob1').style.opacity = 1;
  document.getElementById('blob2').style.background = m.blob2;
  document.getElementById('blob2').style.opacity = 1;
  document.getElementById('blob3').style.background = m.blob3;
  document.getElementById('blob3').style.opacity = 1;
}

function clearBlobs() {
  ['blob1','blob2','blob3'].forEach(id => {
    document.getElementById(id).style.opacity = 0;
  });
}

function renderGrid() {
  document.getElementById('moodGrid').innerHTML = moods.map(m => `
    <button class="mood-btn${current === m.id ? ' active' : ''}"
      onclick="selectMood('${m.id}')"
      style="${current === m.id
        ? `background: linear-gradient(135deg, ${m.color}18 0%, ${m.color}08 100%); border-color: ${m.color}55;`
        : ''}">
      <div style="
        position: absolute; inset: 0; border-radius: 16px; opacity: 0;
        background: linear-gradient(135deg, ${m.color}15 0%, ${m.color}06 100%);
        transition: opacity 0.3s;
      " class="mood-hover-bg"></div>
      <div class="mood-icon-wrap" style="background: ${m.iconBg}; color: ${m.iconColor};">
        ${m.icon}
      </div>
      <span class="mood-label">${m.label}</span>
      <span class="mood-sub">${m.sub}</span>
    </button>
  `).join('');

  document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('mouseenter', () => {
      btn.querySelector('.mood-hover-bg').style.opacity = 1;
    });
    btn.addEventListener('mouseleave', () => {
      btn.querySelector('.mood-hover-bg').style.opacity = 0;
    });
  });
}

function renderPanel(m) {
  document.getElementById('vibeInner').innerHTML = `

        <div class="vibe-name" style="color: ${m.color};">${m.name}</div>
        <div class="vibe-tagline">${m.tagline}</div>
      </div>
      <div class="vibe-palette">
        ${m.palette.map(c => `<div class="palette-dot" style="background:${c};" title="${c}"></div>`).join('')}
      </div>
    </div>

    <div class="vibe-stats">
      <div class="stat-block">
        <span class="stat-label">Tempo</span>
        <span class="stat-val">${m.tempo}</span>
      </div>
      <div class="stat-block">
        <span class="stat-label">Energy</span>
        <span class="stat-val">${m.energy}</span>
      </div>
      <div class="stat-block">
        <span class="stat-label">Tracks</span>
        <span class="stat-val">${m.tracks.length} songs</span>
      </div>
    </div>

    <div class="vibe-body">
      <div>
        <p class="section-heading">Artists</p>
        <div class="artist-chips">
          ${m.artists.map(a => `<span class="artist-chip">${a}</span>`).join('')}
        </div>
      </div>
      <div>
        <p class="section-heading">Playlist</p>
        <div class="track-list">
          ${m.tracks.map((t, i) => `
            <div class="track-row">
              <span class="track-num">${String(i+1).padStart(2,'0')}</span>
              <div class="track-info">
                <div class="track-name">${t.name}</div>
                <div class="track-artist">${t.artist}</div>
              </div>
              <span class="track-dur">${t.dur}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function selectMood(id) {
  const panel = document.getElementById('vibePanel');
  if (current === id) {
    current = null;
    panel.classList.remove('open');
    clearBlobs();
  } else {
    current = id;
    const m = moods.find(x => x.id === id);
    renderPanel(m);
    panel.classList.add('open');
    setBlobs(m);
    setTimeout(() => {
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
  }
  renderGrid();
}

renderGrid();
</script>
</body>
</html>
