<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scroll-bar</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="shortcut icon" href="./Vishal_logo.png" type="image/x-icon">
    </head>

    <body>

        <div class="indicator" id="scrollIndicator"></div>

        <div class="circle-container">
            <svg width="70" height="70">
                <circle cx="35" cy="35" r="30" class="bg" />
                <circle cx="35" cy="35" r="30" class="progress" id="circle" />
            </svg>
            <div class="percent" id="percent">0%</div>
        </div>

        <div class="container" id="container"></div>

        <script src="script.js"></script>
    </body>

</html>
