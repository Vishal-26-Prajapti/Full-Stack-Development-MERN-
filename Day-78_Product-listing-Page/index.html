<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product Store</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="./style.css">
        <link rel="shortcut icon" href="./Vishal_logo.png" type="image/x-icon">
    </head>

    <body>

        <header>
            <div class="logo">VishalShoppy<span>.</span></div>
            <div class="header-right">
                <span id="cart-count" style="font-size:0.875rem; color:var(--muted);">0 items</span>
                <button class="cart-btn">🛒 Cart</button>
            </div>
        </header>

        <main class="main">
            <div class="toolbar">
                <h1>All Products</h1>
                <div class="toolbar-controls">
                    <input type="search" id="search-input" placeholder="Search products…" />
                    <select id="sort-select">
                        <option value="default">Sort: Default</option>
                        <option value="price-asc">Price: Low → High</option>
                        <option value="price-desc">Price: High → Low</option>
                        <option value="rating">Top Rated</option>
                        <option value="name">Name A–Z</option>
                    </select>
                </div>
            </div>

            <div class="category-filters" id="category-filters">
                <button class="cat-btn active" data-cat="all">All</button>
            </div>

            <p class="results-info" id="results-info"></p>

            <div class="grid" id="product-grid"></div>
        </main>

        <script src="./script.js"></script>
    </body>

</html>
