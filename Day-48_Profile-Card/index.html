<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile Card</title>
        <link rel="stylesheet" href="./style.css">
        <link rel="shortcut icon" href="./Vishal_logo.png" type="image/x-icon">
    </head>

    <body>
        <div class="main">
            <form>
                <label for="name">Name</label><br>
                <input type="text" id="name" placeholder="Enter your name"><br><br>

                <label for="bio">Bio</label><br>
                <input type="text" id="bio" placeholder="Your bio"><br><br>

                <label for="offers">What you offer</label><br>
                <input type="text" id="offers" placeholder="What you offer"><br><br>

                <label for="insta">Instagram ID</label><br>
                <input type="text" id="insta" placeholder="Enter your ID"><br><br>

                <input type="file" id="photo"><br><br>

                <button type="submit">Create Card</button>
            </form>

            <div class="card-container">
            </div>
        </div>
        <script src="./script.js"></script>
    </body>

</html>
