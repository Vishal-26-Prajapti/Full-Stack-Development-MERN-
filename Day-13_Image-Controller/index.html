<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Image Style Controller</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="container">
      <h1>CSS Image Style Controller</h1>
      <p class="subtitle">
        Adjust image appearance dynamically using real-time CSS controls
      </p>

      <div class="content">
        <div class="css-controller">
          <div class="control">
            <label>
              Background Color
              <span class="value" data-for="base"></span>
            </label>
            <input type="color" name="base" value="#ff8500" />
          </div>

          <div class="control">
            <label>
              Scale
              <span class="value" data-for="scale"></span>
            </label>
            <input
              type="range"
              name="scale"
              min="0.5"
              max="2"
              step="0.01"
              value="1"
            />
          </div>

          <div class="control">
            <label>
              Border Radius
              <span class="value" data-for="border-radius"></span>
            </label>
            <input
              type="range"
              name="border-radius"
              min="0"
              max="100"
              value="20"
              data-sizing="px"
            />
          </div>

          <div class="control">
            <label>
              Padding
              <span class="value" data-for="padding"></span>
            </label>
            <input
              type="range"
              name="padding"
              min="0"
              max="60"
              value="20"
              data-sizing="px"
            />
          </div>

          <div class="control">
            <label>
              Blur Intensity
              <span class="value" data-for="blur"></span>
            </label>
            <input
              type="range"
              name="blur"
              min="0"
              max="25"
              value="0"
              data-sizing="px"
            />
          </div>
        </div>

        <div class="image-box">
          <img
            src="https://cdn.pixabay.com/photo/2023/08/26/22/44/brewers-blackbird-8215850_640.jpg"
            alt="Live styled image preview"
          />
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
