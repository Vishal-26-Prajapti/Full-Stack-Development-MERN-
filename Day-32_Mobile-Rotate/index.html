<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Stranger Things 3D Carousel</title>
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
</head>

<body>

        <div class="bg-container">
                <div class="bg-layer visible" id="bg1"></div>
                <div class="bg-layer" id="bg2"></div>
        </div>

        <div class="neon-glow"></div>

        <canvas id="particle-canvas"></canvas>

        <div class="scene">
                <div class="carousel">
                        <div class="card" data-index="0" data-title="Mike">
                                <img src="https://picsum.photos/800/1000?random=1" alt="Mike">
                        </div>
                        <div class="card" data-index="1" data-title="Jane"><img
                                        src="https://picsum.photos/800/1000?random=2" alt="Jane"></div>
                        <div class="card" data-index="2" data-title="Will"><img
                                        src="https://picsum.photos/800/1000?random=3" alt="Will"></div>
                        <div class="card" data-index="3" data-title="Dustin"><img
                                        src="https://picsum.photos/800/1000?random=4" alt="Dustin"></div>
                        <div class="card" data-index="4" data-title="Max"><img
                                        src="https://picsum.photos/800/1000?random=5" alt="Max"></div>
                        <div class="card" data-index="5" data-title="Lucas"><img
                                        src="https://picsum.photos/800/1000?random=6" alt="Lucas"></div>
                        <div class="card" data-index="6" data-title="Steve"><img
                                        src="https://picsum.photos/800/1000?random=7" alt="Steve"></div>
                        <div class="card" data-index="7" data-title="Nancy"><img
                                        src="https://picsum.photos/800/1000?random=8" alt="Nancy"></div>
                        <div class="card" data-index="8" data-title="Jonathan"><img
                                        src="https://picsum.photos/800/1000?random=9" alt="Jonathan"></div>
                </div>
        </div>

        <script src="script.js"></script>
</body>

</html>
