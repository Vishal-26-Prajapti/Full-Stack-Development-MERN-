<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Cards</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="./style.css">
        <link rel="shortcut icon" href="./Vishal_logo.png" type="image/x-icon">
    </head>

    <body>
        <div class="flex flex-col items-center gap-8 px-4 py-10">
            <input type="text" id="search" placeholder="Search users..."
                class="inp w-[20%] max-w-md px-3 py-2 rounded-xl outline-none bg-[#111] text-white placeholder-gray-500 border border-gray-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all duration-300">
            <div
                class="card-container grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 w-full max-w-[1800px] mx-auto">
            </div>
        </div>

        <script src="./script.js"></script>
    </body>

</html>
