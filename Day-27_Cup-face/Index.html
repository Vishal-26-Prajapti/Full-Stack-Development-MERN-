<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cute Animated Cup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./Image/Vishal_logo.png" type="image/x-icon">
</head>

<body>

    <div class="wrapper">
        <div class="cup">
            <div class="handle"></div>

            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="blush left"></div>
            <div class="blush right"></div>
            <div class="mouth"></div>
        </div>

        <div class="shadow"></div>
        <div class="cup-text">Enjoy your coffee! ☕</div>
    </div>

</body>

</html>
