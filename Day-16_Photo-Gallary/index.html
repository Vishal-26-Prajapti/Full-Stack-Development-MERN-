<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Photo Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <h1>Photo Gallery</h1>
        <p>A curated collection of moments captured through the lens</p>
      </div>
    </header>

    <!-- Main -->
    <main class="main">
      <div class="container">
        <section class="gallery">
          <figure class="gallery-item large">
            <img
              src="https://picsum.photos/800/1000?random=1"
              alt="Image-1"
              loading="lazy"
            />
            <div class="overlay">View</div>
          </figure>

          <figure class="gallery-item">
            <img
              src="https://picsum.photos/800/1000?random=2"
              alt="Image-2"
              loading="lazy"
            />
            <div class="overlay">View</div>
          </figure>

          <figure class="gallery-item">
            <img
              src="https://picsum.photos/800/1000?random=3"
              alt="Image-3"
              loading="lazy"
            />
            <div class="overlay">View</div>
          </figure>

          <figure class="gallery-item tall">
            <img
              src="https://picsum.photos/800/1000?random=4"
              alt="Image-4"
              loading="lazy"
            />
            <div class="overlay">View</div>
          </figure>

          <figure class="gallery-item wide">
            <img
              src="https://picsum.photos/800/1000?random=5"
              alt="Image-5"
              loading="lazy"
            />
            <div class="overlay">View</div>
          </figure>

          <figure class="gallery-item">
            <img
              src="https://picsum.photos/800/1000?random=6"
              alt="Image-6"
              loading="lazy"
            />
            <div class="overlay">View</div>
          </figure>

          <figure class="gallery-item">
            <img
              src="https://picsum.photos/800/1000?random=7"
              alt="Image-7"
              loading="lazy"
            />
            <div class="overlay">View</div>
          </figure>

          <figure class="gallery-item">
            <img
              src="https://picsum.photos/800/1000?random=8"
              alt="Image-8"
              loading="lazy"
            />
            <div class="overlay">View</div>
          </figure>

          <figure class="gallery-item">
            <img
              src="https://picsum.photos/800/1000?random=9"
              alt="Image-9"
              loading="lazy"
            />
            <div class="overlay">View</div>
          </figure>

          <figure class="gallery-item">
            <img
              src="https://picsum.photos/800/1000?random=10"
              alt="Image-10"
              loading="lazy"
            />
            <div class="overlay">View</div>
          </figure>
        </section>
      </div>
    </main>
  </body>
</html>
