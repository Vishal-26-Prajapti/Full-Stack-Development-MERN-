<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pomodoro Timer</title>
        <link rel="stylesheet" href="./style.css" />
        <link rel="shortcut icon" href="./Vishal_logo.png" type="image/x-icon">
    </head>

    <body>

        <div class="glass-card">
            <h1>🍅 Pomodoro Timer</h1>

            <div class="mode" id="mode">Focus Session</div>

            <div class="timer" id="time">25:00</div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="buttons">
                <button class="btn start" id="startBtn">Start</button>
                <button class="btn pause" id="pauseBtn">Pause</button>
                <button class="btn reset" id="resetBtn">Reset</button>
            </div>

            <p class="footer">Stay focused. Take breaks. Repeat.</p>
        </div>

        <script src="./script.js"></script>
    </body>

</html>
