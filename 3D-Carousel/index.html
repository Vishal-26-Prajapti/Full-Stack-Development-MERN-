<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Carousel</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-container">
        <div class="bg-layer visible" id="bg1"></div>
        <div class="bg-layer" id="bg2"></div>
    </div>

    <div class="neon-glow"></div>

    <canvas id="particle-canvas"></canvas>

    <div class="scene">
        <div class="carousel">

            <div class="card" data-index="0" data-title="Vishal">
                <img src="https://picsum.photos/800/1000?random=1" alt="Image-1">
            </div>

            <div class="card" data-index="1" data-title="Vishal">
                <img src="https://picsum.photos/800/1000?random=2" alt="Image-2">
            </div>

            <div class="card" data-index="2" data-title="Vishal">
                <img src="https://picsum.photos/800/1000?random=3" alt="Image-3">
            </div>

            <div class="card" data-index="3" data-title="Vishal">
                <img src="https://picsum.photos/800/1000?random=4" alt="Image-4">
            </div>

            <div class="card" data-index="4" data-title="Vishal">
                <img src="https://picsum.photos/800/1000?random=5" alt="Image-5">
            </div>

            <div class="card" data-index="5" data-title="Vishal">
                <img src="https://picsum.photos/800/1000?random=6" alt="Image-6">
            </div>

            <div class="card" data-index="6" data-title="Vishal">
                <img src="https://picsum.photos/800/1000?random=7" alt="Image-7">
            </div>

            <div class="card" data-index="7" data-title="Vishal">
                <img src="https://picsum.photos/800/1000?random=8" alt="Image-8">
            </div>

            <div class="card" data-index="8" data-title="Vishal">
                <img src="https://picsum.photos/800/1000?random=9" alt="Image-9">
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
