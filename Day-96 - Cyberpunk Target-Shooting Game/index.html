<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Neon Reflex Cyber-Shooter</title>
        <link rel="stylesheet" href="./style.css">
        <link rel="shortcut icon" href="./Vishal_logo.png" type="image/x-icon">
    </head>

    <body id="game-body">
        <canvas id="gameCanvas"></canvas>

        <div id="crosshair"></div>

        <div id="ui-layer">
            <div class="hud">
                <div id="score-board">SCORE: 00</div>
                <div id="timer-board">TIME: 30</div>
            </div>
        </div>

        <div id="game-over-screen">
            <h1 style="font-size: 3.5rem; text-shadow: 0 0 20px #ff0055;">SYSTEM OVERRIDE</h1>
            <p style="color: #fff; margin-top: 10px; font-size: 1.2rem;" id="final-score">FINAL SCORE: 0</p>
            <button class="btn" onclick="startGame()">Restart</button>
        </div>
        <script src="./script.js"></script>
    </body>

</html>
