<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Snake Game</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>

        <main class="app">
            <h2 style="text-align:center; margin-bottom:10px;">🐍 Snake Game</h2>

            <header class="top-bar">
                <div class="card">🏆 High: <span id="high-score">0</span></div>
                <div class="card">🎯 Score: <span id="score">0</span></div>
                <div class="card">⏱ Time: <span id="time">00:00:00</span></div>
            </header>

            <section class="game-area">
                <div class="board"></div>
            </section>

            <div class="modal">
                <div class="modal-box start-game">
                    <h1>🐍 Snake Game</h1>
                    <button class="btn btn-start">Start Game</button>
                </div>

                <div class="modal-box game-over">
                    <h1>💀 Game Over</h1>
                    <button class="btn btn-restart">Restart Game</button>
                </div>
            </div>

        </main>

        <script src="script.js"></script>
    </body>

</html>
