<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Carousel Project</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <main class="main-container">
      <aside class="col-1">
        <div class="items">
          <div class="item active">
            <img
              src="./imgs/ear-buds.png"
              alt="Wireless ear buds front view"
              loading="lazy"
            />
          </div>
          <div class="item">
            <img
              src="./imgs/ear-buds2.png"
              alt="Wireless ear buds side view"
              loading="lazy"
            />
          </div>
          <div class="item">
            <img
              src="./imgs/ear-buds3.png"
              alt="Wireless ear buds top view"
              loading="lazy"
            />
          </div>
        </div>
      </aside>

      <section class="col-2">
        <div class="carousel">
          <button id="prevBtn" aria-label="Previous image">
            <i class="fas fa-angle-left"></i>
          </button>
          <button id="nextBtn" aria-label="Next image">
            <i class="fas fa-angle-right"></i>
          </button>
          <div class="slides-container">
            <div class="slide">
              <img
                src="./imgs/ear-buds.png"
                alt="Wireless ear buds front view"
                loading="lazy"
              />
            </div>
            <div class="slide">
              <img
                src="./imgs/ear-buds2.png"
                alt="Wireless ear buds side view"
                loading="lazy"
              />
            </div>
            <div class="slide">
              <img
                src="./imgs/ear-buds3.png"
                alt="Wireless ear buds top view"
                loading="lazy"
              />
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
