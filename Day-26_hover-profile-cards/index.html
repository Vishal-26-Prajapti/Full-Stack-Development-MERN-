<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Profile Cards</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./img/Vishal_logo.png" type="image/x-icon">
</head>

<body>

    <div class="container">

        <div class="icon-image">
            <div class="icon">
                <img src="./img/Vishal-Photo.png" alt="Vishal">
            </div>
            <div class="hover-img">
                <img src="./img/Vishal-Photo.png" alt="Vishal Big">
                <div class="content">
                    <div class="details">
                        <div class="name">Vishal Prajapati</div>
                        <div class="job">Frontend Developer</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="icon-image">
            <div class="icon">
                <img src="./img/Alu.png" alt="Alok">
            </div>
            <div class="hover-img">
                <img src="./img/Alu.png" alt="Alok Big">
                <div class="content">
                    <div class="details">
                        <div class="name">Alu Sharma</div>
                        <div class="job">UI Designer</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="icon-image">
            <div class="icon">
                <img src="./img/Hrithik.png" alt="Hrithik">
            </div>
            <div class="hover-img">
                <img src="./img/Hrithik.png" alt="Hrithik Big">
                <div class="content">
                    <div class="details">
                        <div class="name">Hrithik Roshan</div>
                        <div class="job">Backend Developer</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="icon-image">
            <div class="icon">
                <img src="./img/image-1.png" alt="Rohan">
            </div>
            <div class="hover-img">
                <img src="./img/image-1.png" alt="Rohan Big">
                <div class="content">
                    <div class="details">
                        <div class="name">Rohan Singh</div>
                        <div class="job">Full Stack Developer</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="icon-image">
            <div class="icon">
                <img src="./img/Vijay.png" alt="Vijay">
            </div>
            <div class="hover-img">
                <img src="./img/Vijay.png" alt="Vijay Big">
                <div class="content">
                    <div class="details">
                        <div class="name">Vijay Deverkonda</div>
                        <div class="job">DevOps Engineer</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="icon-image">
            <div class="icon">
                <img src="./img/Salman.png" alt="Salman">
            </div>
            <div class="hover-img">
                <img src="./img/Salman.png" alt="Salman Big">
                <div class="content">
                    <div class="details">
                        <div class="name">Salman Khan</div>
                        <div class="job">Mobile App Developer</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
